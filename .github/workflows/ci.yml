name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/peezy_identity_test
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: peezy_identity_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d peezy_identity_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      - run: bun run package:smoke
      - run: docker build --tag peezy-tech-identity:ci .
      - name: Verify production image excludes development tooling
        run: |
          docker run --rm --entrypoint sh peezy-tech-identity:ci -c \
            'test -z "$(find /app/node_modules -path "*/drizzle-kit/package.json" -o -path "*/esbuild/package.json")"'
